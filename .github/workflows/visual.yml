name: Visual
on:
  pull_request:
  push:
    branches: [main]
jobs:
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check Playwright image matches pinned version
        run: node tooling/check-playwright-pin.mjs
      - name: Build samples
        run: pnpm --filter @jurfi/samples... build
      - name: Export guard
        run: pnpm export-guard
        env:
          REQUIRE_DIST: '1'
      - name: Visual-tests package tests
        run: pnpm --filter @jurfi/visual-tests test
      - run: pnpm --filter @jurfi/visual-tests visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/visual/playwright-report
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: tests/visual/test-results
          if-no-files-found: ignore
